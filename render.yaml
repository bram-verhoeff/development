# Render-blueprint voor de PostPilot-backend (Render → New → Blueprint → kies deze repo/branch).
# Geheimen (sync: false) vul je in het Render-dashboard in; ze staan nooit in git.
services:
  - type: web
    name: postpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Eerst de database bijwerken, dan de API starten
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # De Python-versie staat in backend/.python-version
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GENERATION_DAILY_LIMIT
        value: "100"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: logos
      - key: ALLOWED_EMAILS
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_API_VERSION
        value: "202610"
