* { box-sizing: border-box; }

.view { padding-block: 28px 0; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1180px; display: grid; gap: 22px; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.scenes { width: 100%; border-collapse: collapse; font-size: .9rem; }

.table-wrap { overflow-x: auto; }
.post { white-space: pre-wrap; font-size: .95rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; max-width: 68ch; }
.slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.slide { aspect-ratio: 4 / 5; max-width: 100%; border-radius: 8px; background: var(--accent); color: var(--accent-ink); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-display); font-weight: 600; font-size: .98rem; line-height: 1.2; }
.slide:nth-child(even) { background: var(--ink); color: var(--surface); }

.limit { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }

.checks { display: flex; flex-wrap: wrap; gap: 8px; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const idea = id => state.ideas.find(i => i.id === id);
const pfTag = p => `<span class="pf ${p}" title="${PF[p]}">${p.toUpperCase()}</span>`;
const statusTag = s => `<span class="status st-${s}">${STATUS[s]}</span>`;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800);
}
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function isoD(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function addD(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); }
function fmtD(s, opts = { weekday: 'short', day: 'numeric', month: 'short' }) { return parseD(s).toLocaleDateString('nl-NL', opts); }
function gaps() { const out = []; for (let i = 0; i < 7; i++) { const d = addD(TODAY, i); if (!state.cal.some(c => c.date === d)) out.push(d); } return out; }

function scoreRing(n, size = 60) {
  const r = size / 2 - 5, c = 2 * Math.PI * r;
  return `<div class="score" title="Viral-score ${n}/100"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--hot)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c * n / 100} ${c}"/></svg><span>${n}</span></div>`;
}

function generateIdeas(seedTags) {
  if (state.generating) return;

    let picks = state.pool.filter(p => !state.ideas.some(i => i.title === p[0]));
    if (seedTags) picks.sort((a, b) => b[3].filter(t => seedTags.includes(t)).length - a[3].filter(t => seedTags.includes(t)).length);
    picks = picks.slice(0, seedTags ? 3 : 5);
    picks.reverse().forEach(p => {
      const s = p[4];
      state.ideas.unshift({ id: ++uid, title: p[0], hook: p[1], platforms: p[2], tags: p[3], status: 'backlog', score: s, why: [s + 4, s - 6, s + 1, s - 3].map(v => Math.min(98, v)),

}
function planIdea(id) {

  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${state.scriptTab === k}">${l}</button>`).join('')}</div>
  <div class="card stack" style="gap:22px">${body}</div>`;
}

/* ---------- Hook lab ---------- */
const PATTERNS = [
  ['Vraag', t => `Waarom lukt ${t} bij jou niet, terwijl je alles goed doet?`],
  ['Contrast', t => `Iedereen zegt minder eten. Ik zeg: ${t} begint bij beter slapen.`],
  ['Getal', t => `3 dingen die ik deed voor ${t}. Nummer 2 kost je 0 euro.`],
  ['Stop met…', t => `Stop met calorieën tellen als je ${t} wilt.`],
  ['Niemand vertelt je', t => `Niemand vertelt je dit over ${t}.`],
  ['Fout', t => `De grootste fout bij ${t}? Je doet het té goed.`],
  ['Resultaat eerst', t => `-6 kg in 10 weken, ${t}. Dit is precies wat we deden.`],
  ['POV', t => `POV: je probeert ${t} met een baan van 50 uur per week.`],
  ['Uitdaging', t => `Ik daag je uit: 14 dagen ${t}. Dit gebeurt er.`],
  ['Mythe', t => `“Je moet honger lijden voor ${t}.” Totale onzin, en dit is waarom.`]
];
function vHooklab() {
  const v = state.hookVariants;
  return `
  <div class="head"><div><h1>Hook-lab</h1><p>De eerste drie seconden bepalen of iemand doorscrolt. Geef een onderwerp op en krijg tien hooks, elk volgens een bewezen patroon.</p></div></div>
  <form class="card row" id="hookForm" style="align-items:end">
    <label class="field" style="flex:1 1 260px"><span>Onderwerp</span><input type="text" id="hookTopic" value="${esc(state.hookTopic)}"></label>
    <button class="btn primary" type="submit">Schrijf 10 hooks</button>
  </form>
  ${v ? `<div class="card">${v.map(([p, h], n) => `<div class="variant"><span class="chip" style="justify-self:start">${p}</span><span>${esc(h)}</span><button class="btn small" data-savehook="${n}">Bewaar als idee</button></div>`).join('')}</div>` : ''}`;
}

/* ---------- Calendar ---------- */
function vCalendar() {
  const start = '2026-10-12';
  const days = Array.from({ length: 28 }, (_, n) => addD(start, n));
  const g = gaps();
  const sel = state.moveId && state.cal.find(c => c.id === state.moveId);
  return `
  <div class="head"><div><h1>Kalender</h1><p>Sleep posts naar een andere dag. Op een telefoon tik je eerst op een post en dan op de nieuwe dag.</p></div>
  <span class="label">12 okt – 8 nov 2026</span></div>
  <div class="card stack" style="gap:8px"><span class="label">Beste posttijden voor jouw doelgroep</span>
    <div class="besttimes">${Object.keys(PF).map(p => `<span>${pfTag(p)} <span class="mono">${BEST[p]}</span>${p === 'in' ? ' <span class="muted">di–do</span>' : ''}</span>`).join('')}</div>
    <small class="muted">Nu nog op basis van algemene benchmarks voor NL. Vanaf fase 3 worden dit jouw eigen beste momenten.</small></div>
  ${sel ? `<div class="alert info"><b>Verplaatsen:</b><span>${esc(idea(sel.ideaId).title)}. Tik op een dag. <button class="btn small ghost" id="cancelMove">Annuleren</button></span></div>`
       : g.length ? `<div class="alert"><b>${g.length} lege dagen</b><span>in de komende 7 dagen. Een vast ritme helpt het algoritme. Plan een idee in via <a href="#ideeen">Ideeën</a>.</span></div>` : ''}
  <div class="cal">
    ${['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map(d => `<div class="dow">${d}</div>`).join('')}
    ${days.map(d => {
      const items = state.cal.filter(c => c.date === d).sort((a, b) => a.time.localeCompare(b.time));
      const cls = ['day', d < TODAY ? 'past' : '', d === TODAY ? 'today' : '', g.includes(d) ? 'gap' : '', sel && d >= TODAY ? 'pick' : ''].join(' ');
      return `<div class="${cls}" data-day="${d}"><div class="day-n"><b>${parseD(d).getDate()}</b><span>${fmtD(d, { weekday: 'short' })}${parseD(d).getDate() === 1 || d === start ? ' ' + fmtD(d, { month: 'short' }) : ''}</span></div>
        ${items.map(c => `<div class="item ${state.moveId === c.id ? 'sel' : ''}" draggable="${d >= TODAY}" data-item="${c.id}" tabindex="0"><span class="row" style="gap:4px">${pfTag(c.pf)}<span class="mono muted">${c.time}</span></span><span class="t">${esc(idea(c.ideaId).title)}</span></div>`).join('')}
        ${g.includes(d) ? '<small style="color:var(--danger);font-weight:600">Geen post</small>' : ''}</div>`;
    }).join('')}
  </div>`;
}
function moveItem(id, day) {
  const c = state.cal.find(x => x.id === id);
  if (!c || day < TODAY) return;
  c.date = day; state.moveId = null;
  toast(`Verplaatst naar ${fmtD(day, { weekday: 'long', day: 'numeric', month: 'short' })}`);
  render();
}

/* ---------- Brand ---------- */
function vBrand() {
  const b = state.brand;
  return `
  <div class="head"><div><h1>Brand-profiel</h1><p>Alles wat Hookline genereert, gebruikt dit profiel. Hoe concreter je het invult, hoe meer de content als jou klinkt.</p></div>
  <button class="btn primary" id="saveBrand">Opslaan</button></div>
  <div class="grid-2">
    <div class="card stack">
      <label class="field"><span>Merknaam</span><input type="text" id="bName" value="${esc(b.name)}"></label>
      <label class="field"><span>Niche</span><input type="text" id="bNiche" value="${esc(b.niche)}"></label>
      <label class="field"><span>Doelgroep</span><textarea id="bAud">${esc(b.audience)}</textarea></label>
      <label class="field"><span>Contentpijlers</span><input type="text" id="bPil" value="${esc(b.pillars)}"><small>De 3–5 onderwerpen waar je bekend om wilt staan.</small></label>
    </div>
    <div class="card stack">
      <label class="field"><span>Tone of voice</span><textarea id="bTone">${esc(b.tone)}</textarea></label>
      <label class="field"><span>Contenttaal</span><select id="bLang"><option value="nl" ${b.lang === 'nl' ? 'selected' : ''}>Nederlands</option><option value="en" ${b.lang === 'en' ? 'selected' : ''}>Engels</option><option value="both" ${b.lang === 'both' ? 'selected' : ''}>Beide</option></select></label>
      <div class="field"><span>Verboden woorden</span>
        <div class="tags">${b.banned.map((w, n) => `<span class="tag-x">${esc(w)}<button type="button" data-unban="${n}" aria-label="Verwijder ${esc(w)}">×</button></span>`).join('')}</div>
        <form class="row" id="banForm" style="flex-wrap:nowrap"><input type="text" id="banInput" placeholder="Woord toevoegen"><button class="btn small" type="submit">Toevoegen</button></form></div>
      <label class="field"><span>Voorbeeldpost die echt als jou klinkt</span><textarea id="bEx">${esc(b.examples)}</textarea></label>
    </div>
  </div>`;
}

/* ---------- Settings ---------- */
function vSettings() {
  const yr = state.billing === 'jaar';
  const plans = [
    ['Creator', 12, 120, ['1 brand-profiel', 'Onbeperkt ideeën, scripts en hooks', 'Contentkalender', 'Publiceren op 2 platforms (fase 2)']],
    ['Pro', 29, 290, ['3 brand-profielen', 'Alle platforms', 'Analytics en leerlus', 'Repurposing van lange video’s']]
  ];
  return `
  <div class="head"><div><h1>Instellingen</h1><p>Je eigen Claude-key, je abonnement en je platformkoppelingen.</p></div></div>
  <div class="card stack">
    <div class="row" style="justify-content:space-between"><h2>Claude API-key</h2><span class="pill-ok">● Geldig · vandaag gecontroleerd</span></div>
    <p class="muted" style="max-width:68ch">Hookline gebruikt jouw eigen key van Anthropic. De AI-kosten betaal je dus rechtstreeks aan Anthropic, tegen hun tarieven. Je key wordt versleuteld opgeslagen en is na het opslaan niet meer zichtbaar.</p>
    <div class="row" style="align-items:end">
      <label class="field" style="flex:1 1 280px"><span>Key</span><input type="password" id="apikey" value="sk-ant-api03-voorbeeld-a9F2" autocomplete="off"></label>
      <button class="btn" id="testKey">Key testen</button>
    </div>
    <small class="muted">Nog geen key? Maak er een aan op <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</small>
    <div class="grid-3" style="margin-top:6px">
      <div class="kpi"><span class="label">Tokens deze maand</span><b style="font-size:1.4rem">412.380</b></div>
      <div class="kpi"><span class="label">Geschatte kosten</span><b style="font-size:1.4rem">€ 3,84</b></div>
      <div class="kpi"><span class="label">Generaties</span><b style="font-size:1.4rem">96</b></div>
    </div>
  </div>
  <div class="stack">
    <div class="row" style="justify-content:space-between"><div><h2>Abonnement</h2><p class="muted">Je zit in je proefperiode: nog 14 dagen alles van Creator.</p></div>
      <div class="seg" role="group" aria-label="Betaalperiode"><button data-bill="maand" aria-pressed="${!yr}">Per maand</button><button data-bill="jaar" aria-pressed="${yr}">Per jaar · 2 mnd gratis</button></div></div>
    <div class="grid-2">${plans.map(([n, m, y, f], k) => `
      <div class="card plan ${k === 0 ? 'current' : ''}"><div class="row" style="justify-content:space-between"><h3>${n}</h3>${k === 0 ? '<span class="chip">Huidige proef</span>' : ''}</div>
        <div><span class="price">€${yr ? y : m}</span> <span class="muted">/ ${yr ? 'jaar' : 'maand'}, excl. btw</span></div>
        <ul>${f.map(x => `<li>${x}</li>`).join('')}</ul>
        <button class="btn ${k === 0 ? 'primary' : ''}" data-buy="${n}">Kies ${n}</button></div>`).join('')}</div>
  </div>
  <div class="card stack"><h2>Platformkoppelingen</h2>
    <div>${Object.entries(PF).map(([k, v]) => `<div class="conn">${pfTag(k)}<div><b>${v}</b><br><small class="muted">${{ tt: 'Content Posting API · een creator- of business-account is nodig', ig: 'Instagram Graph API · een professioneel account is nodig', yt: 'YouTube Data API v3', in: 'LinkedIn API · voor je profiel of bedrijfspagina' }[k]}</small></div><span class="chip">Fase 2</span></div>`).join('')}</div>
  </div>`;
}

/* ---------- Render + events ---------- */
function render() {
  renderNav();
  const v = { dashboard: vDashboard, ideeen: vIdeas, scripts: vScripts, hooklab: vHooklab, kalender: vCalendar, brand: vBrand, instellingen: vSettings }[state.view];
  $('#view').innerHTML = `<div class="view">${v()}</div>`;
}
function go(view) { state.view = view; if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.some(v => v[0] === h)) go(h); });

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-item], [data-day]');
  if (!t) return;
  const d = t.dataset;
  if (t.id === 'gen') generateIdeas();
  else if (d.more) generateIdeas(idea(+d.more).tags);
  else if (d.script) { state.scriptIdea = +d.script; state.hookPick = 0; go('scripts'); }
  else if (d.plan) planIdea(+d.plan);
  else if (d.tab) { state.scriptTab = d.tab; render(); }
  else if (t.id === 'reroll') { state.hookSeed++; state.hookPick = 0; render(); }
  else if (t.id === 'copy') {
    const el = $('#copytext') || $('.scenes') || $('.post');
    const txt = el ? el.innerText : '';
    navigator.clipboard?.writeText(txt).then(() => toast('Gekopieerd'), () => toast('Kopiëren werkt hier niet. Selecteer de tekst handmatig.'));
  }
  else if (d.savehook !== undefined) {
    const [p, h] = state.hookVariants[+d.savehook];
    state.ideas.unshift({ id: ++uid, title: h.replace(/[.?!].*$/, ''), hook: h, platforms: ['tt','ig'], tags: [state.hookTopic.split(' ')[0]], status: 'backlog', score: 70 + (h.length % 20), why: [85, 70, 72, 68],
      points: [['Het misverstand', 'Wat de meeste mensen denken.'], ['Wat echt werkt', 'Jouw nuchtere aanpak.'], ['Zo begin je', 'Eén actie voor morgen.']], cta: 'Volg voor meer.' });
    t.disabled = true; t.textContent = 'Bewaard'; renderNav(); toast(`Hook (${p}) bewaard in je backlog`);
  }
  else if (d.unban !== undefined) { state.brand.banned.splice(+d.unban, 1); render(); }
  else if (t.id === 'saveBrand') {
    Object.assign(state.brand, { name: $('#bName').value, niche: $('#bNiche').value, audience: $('#bAud').value, pillars: $('#bPil').value, tone: $('#bTone').value, lang: $('#bLang').value, examples: $('#bEx').value });
    toast('Brand-profiel opgeslagen');
  }
  else if (d.bill) { state.billing = d.bill; render(); }
  else if (d.buy) toast(`In de echte app opent hier Stripe Checkout voor ${d.buy}.`);
  else if (t.id === 'testKey') toast('Key werkt. Testaanroep gelukt.');
  else if (t.id === 'cancelMove') { state.moveId = null; render(); }
  else if (d.item) { const id = +d.item; const c = state.cal.find(x => x.id === id); if (c.date < TODAY) return; state.moveId = state.moveId === id ? null : id; render(); }
  else if (d.day && state.moveId) moveItem(state.moveId, d.day);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fStatus') { state.filter.status = t.value; render(); }
  if (t.id === 'fPf') { state.filter.pf = t.value; render(); }
  if (t.id === 'scriptIdea') { state.scriptIdea = +t.value; state.hookPick = 0; render(); }
  if (t.name === 'hook') { state.hookPick = +t.value; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'hookForm') {
    state.hookTopic = $('#hookTopic').value.trim() || 'afvallen zonder dieet';
    state.hookVariants = PATTERNS.map(([p, f]) => [p, f(state.hookTopic)]);
    render();
  }
  if (e.target.id === 'banForm') {
    const v = $('#banInput').value.trim();
    if (v && !state.brand.banned.includes(v)) state.brand.banned.push(v);
    render(); $('#banInput')?.focus();
  }
});
let dragId = null;
document.addEventListener('dragstart', e => { const it = e.target.closest?.('[data-item]'); if (it) { dragId = +it.dataset.item; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', it.dataset.item); } });
document.addEventListener('dragover', e => { const day = e.target.closest?.('[data-day]'); if (day && dragId && day.dataset.day >= TODAY) { e.preventDefault(); document.querySelectorAll('.day.over').forEach(x => x.classList.remove('over')); day.classList.add('over'); } });
document.addEventListener('dragleave', e => { const day = e.target.closest?.('[data-day]'); if (day && !day.contains(e.relatedTarget)) day.classList.remove('over'); });
document.addEventListener('drop', e => { const day = e.target.closest?.('[data-day]'); if (day && dragId) { e.preventDefault(); moveItem(dragId, day.dataset.day); } dragId = null; });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.day.over').forEach(x => x.classList.remove('over')); });

state.hookVariants = PATTERNS.map(([p, f]) => [p, f(state.hookTopic)]);
const startHash = location.hash.slice(1);
state.view = VIEWS.some(v => v[0] === startHash) ? startHash : 'dashboard';
render();
</script>
