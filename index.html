<!DOCTYPE html>
<html lang="nl-NL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agevo // Bram Verhoeff</title>
  <meta name="description" content="Agevo development testserver van Bram Verhoeff.">
  <meta name="author" content="Bram Verhoeff">
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="alternate icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header -->
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <a href="./" class="brand-link" title="AgevoDev">
          <picture>
            <source srcset="assets/logo.svg" type="image/svg+xml">
            <img src="assets/logo.png" alt="AgevoDev Software Development" class="brand-logo" height="38">
          </picture>
        </a>
        <div class="brand-sub-badge">
          <span class="brand-author">Bram Verhoeff</span>
        </div>
      </div>
      <div class="server-status">
        <span class="status-dot"></span>
        <span>Testserver Actief</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Intro / Title -->
      <div class="title-area">
        <h1 class="page-title">Git Branches</h1>
        <p class="page-subtitle">Kies een branch om het bijbehorende testproduct te openen:</p>
      </div>

      <!-- Branches Grid -->
      <div class="branches-grid" id="branches-container">
        <!-- Dynamically loaded via main.js -->
        <div class="loading">Bezig met laden van branches...</div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand-info">
        <span>&copy; 2026 <strong>Agevo</strong> &bull; Bram Verhoeff</span>
        <span class="footer-divider">&bull;</span>
        <span class="footer-kvk font-mono">KvK: <strong>42160840</strong></span>
      </div>

      <div class="footer-contact-links">
        <a href="mailto:info@agevodev.nl" class="footer-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>info@agevodev.nl</span>
        </a>
        <a href="https://instagram.com/agevodev" target="_blank" rel="noopener noreferrer" class="footer-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          <span>@agevodev</span>
        </a>
      </div>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
