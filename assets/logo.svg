<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="60%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#95d5b2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b5835a" />
      <stop offset="100%" stop-color="#d4a373" />
    </linearGradient>
  </defs>

  <!-- Organic Emblem: Tree Canopy & Living Soil Curve -->
  <g transform="translate(6, 6)">
    <!-- Soil base / river curve -->
    <path d="M 6 48 C 18 42, 34 54, 48 44 C 44 52, 28 56, 10 54 Z" fill="url(#goldGrad)" opacity="0.9" />
    
    <!-- Central trunk / stem -->
    <path d="M 28 49 C 27 34, 28 22, 29 12" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round" />
    
    <!-- Left canopy leaf -->
    <path d="M 28 32 C 16 30, 8 20, 14 10 C 22 10, 26 22, 28 32 Z" fill="url(#leafGrad)" />
    
    <!-- Right canopy leaf -->
    <path d="M 29 25 C 38 18, 46 22, 48 12 C 38 8, 30 16, 29 25 Z" fill="#40916c" opacity="0.95" />
    
    <!-- Top central sprout -->
    <path d="M 29 14 C 24 6, 32 2, 34 0 C 37 4, 34 10, 29 14 Z" fill="#74c69d" />

    <!-- Small fruit berry accents -->
    <circle cx="16" cy="22" r="2.8" fill="#d97706" />
    <circle cx="41" cy="24" r="2.2" fill="#e11d48" />
    <circle cx="34" cy="8" r="2" fill="#f59e0b" />
  </g>

  <!-- Typography -->
  <text x="74" y="34" font-family="'Fraunces', 'Playfair Display', Georgia, serif" font-size="25" font-weight="700" fill="#1b4332" letter-spacing="-0.3px">
    Bloeiende Landen
  </text>
  <text x="75" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#606f65" letter-spacing="2.6px">
    REGENERATIEF VOEDSELBOS
  </text>
</svg>
