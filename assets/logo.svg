<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" height="44" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="sortGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="sortGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Recycle / Cycle Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Circle -->
    <circle cx="30" cy="30" r="28" fill="#10b981" fill-opacity="0.1" stroke="url(#sortGrad1)" stroke-width="2.5" stroke-dasharray="4 2" />
    
    <!-- 3 Cycling Arrows for Recycling & Sorting -->
    <path d="M 30 11 L 38 21 L 22 21 Z" fill="#10b981" />
    <path d="M 30 18 C 38 18, 44 24, 46 32" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <path d="M 47 41 L 43 53 L 33 43 Z" fill="#06b6d4" />
    <path d="M 43 45 C 39 51, 33 54, 25 53" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <path d="M 13 38 L 17 26 L 27 36 Z" fill="#3b82f6" />
    <path d="M 17 35 C 16 27, 21 20, 28 18" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Center Smart AI Dot -->
    <circle cx="30" cy="30" r="4.5" fill="#f59e0b" filter="url(#glow)" />
  </g>

  <!-- Typography: SortCycle -->
  <text x="82" y="47" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#ffffff">Sort</tspan><tspan fill="#10b981">Cycle</tspan>
  </text>

  <!-- Subtitle Badge -->
  <rect x="84" y="55" width="170" height="18" rx="4" fill="#1e293b" />
  <text x="89" y="68" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="1px">
    AI SLIMME AFVALSORTEERDER
  </text>
</svg>
