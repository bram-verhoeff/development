<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" fill="none" height="42" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="bracketGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Left bracket < -->
  <path d="M 38 23 L 17 45 L 38 67" stroke="url(#bracketGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Slash / -->
  <path d="M 56 22 L 43 68" stroke="url(#slashGrad)" stroke-width="7.5" stroke-linecap="round" />

  <!-- Right bracket > -->
  <path d="M 61 23 L 82 45 L 61 67" stroke="url(#rightGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AgevoDev Text -->
  <text x="98" y="54" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#ffffff">Agevo</tspan><tspan fill="#3b82f6">Dev</tspan>
  </text>

  <!-- Subtitle: SOFTWARE DEVELOPMENT -->
  <text x="101" y="70" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="4px">
    SOFTWARE DEVELOPMENT
  </text>
</svg>
