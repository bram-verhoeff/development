<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="ballTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3344" />
      <stop offset="100%" stop-color="#cc1122" />
    </linearGradient>
    <linearGradient id="ballBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dddddd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#electricGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Outer Ring Background -->
  <circle cx="50" cy="50" r="44" fill="#0c121e" />

  <!-- Pokéball Top Half -->
  <path d="M 12 50 A 38 38 0 0 1 88 50 Z" fill="url(#ballTop)" />

  <!-- Pokéball Bottom Half -->
  <path d="M 12 50 A 38 38 0 0 0 88 50 Z" fill="url(#ballBottom)" />

  <!-- Black Middle Dividing Belt -->
  <rect x="10" y="46" width="80" height="8" fill="#111827" />

  <!-- Center Circle Outer -->
  <circle cx="50" cy="50" r="14" fill="#111827" />

  <!-- Center Circle Inner Button -->
  <circle cx="50" cy="50" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <!-- Electric Bolt in Center -->
  <path d="M 50 36 L 44 48 L 49 48 L 46 62 L 56 47 L 51 47 Z" fill="#ffd200" filter="url(#glow)" />
</svg>
